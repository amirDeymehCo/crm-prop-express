services:
  app:
    build: .
    container_name: props-app-crm
    restart: unless-stopped

    ports:
      - "3002:8000"

    env_file:
      - .env

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command: npm start

    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-db-crm
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3316:3306"

    volumes:
      - crm_mysql_data:/var/lib/mysql

volumes:
  crm_mysql_data:
  node_modules:
