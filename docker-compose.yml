services:
  app:
    build: .
    container_name: props-app-crm
    restart: unless-stopped

    ports:
      - "127.0.0.1:3002:8000"

    env_file:
      - .env

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command: npm start

    depends_on:
      - db

    # متصل کردن سرویس به شبکه اختصاصی با MTU اصلاح‌شده
    networks:
      - crm-net

  db:
    image: mysql:8.0
    container_name: mysql-db-crm
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3316:3306"

    volumes:
      - crm_mysql_data:/var/lib/mysql

    networks:
      - crm-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 256M

    networks:
      - crm-net

volumes:
  crm_mysql_data:
  node_modules:

# تعریف شبکه اختصاصی و تنظیم MTU روی 1400 جهت هماهنگی با کارت شبکه هاست (eno49)
networks:
  crm-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
