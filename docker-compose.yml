name: Deploy Express Crm

on:
  push:
    branches:
      - main

concurrency:
  group: express-crm
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true

          command_timeout: 15m

          script: |
            set -Eeuo pipefail

            echo "==============================="
            echo "🚀 Starting Deployment"
            echo "==============================="

            APP_DIR="${{ secrets.APP_DIR }}"
            APP_PORT=3001

            echo "STEP 1: APP_DIR"
            echo "APP_DIR is set: ${APP_DIR:+YES}"

            echo "STEP 2: Changing directory..."
            cd "$APP_DIR"

            echo "STEP 3: Current directory:"
            /bin/pwd

            echo "STEP 4: Checking git..."
            git --version

            echo "STEP 5: Checking repository..."
            git status

            echo "STEP 6: Fetching repository..."
            timeout 120 git fetch origin

            echo "STEP 7: Getting commits..."
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)

            echo "LOCAL:  $LOCAL"
            echo "REMOTE: $REMOTE"

            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "STEP 8: Updating repository..."
              git reset --hard origin/main
            else
              echo "Repository already up-to-date."
            fi

            echo "STEP 9: Checking Docker..."
            docker --version
            docker compose version

            echo "STEP 10: Docker compose config..."
            docker compose config

            echo "STEP 11: Building Docker image..."
            timeout 12m docker compose build --pull

            echo "STEP 12: Starting containers..."
            docker compose up -d --remove-orphans

            echo "STEP 13: Container status..."
            docker compose ps

            echo "STEP 14: Waiting for application..."
            sleep 10

            SUCCESS=false

            for i in {1..15}; do

              STATUS=$(curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --connect-timeout 3 \
                --max-time 5 \
                http://127.0.0.1:${APP_PORT} || true)

              STATUS=${STATUS:-000}

              echo "Attempt $i -> HTTP $STATUS"

              if [[ "$STATUS" =~ ^(200|201|204|301|302|307|308|401|403|404)$ ]]; then
                SUCCESS=true
                break
              fi

              sleep 5
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ Application did not become healthy"

              echo "========== CONTAINERS =========="
              docker compose ps

              echo "========== LOGS =========="
              docker compose logs --tail=200

              exit 1
            fi

            echo "STEP 15: Cleaning Docker..."
            docker image prune -af

            echo "==============================="
            echo "✅ Deployment Successful"
            echo "==============================="