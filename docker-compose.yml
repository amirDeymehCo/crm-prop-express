services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: props-app-crm
    restart: unless-stopped

    ports:
      - "3002:${PORT}"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      db:
        condition: service_started

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command: ["npm", "start"]

    networks:
      - props-network-crm

  db:
    image: mysql:8.0
    container_name: mysql-db-crm
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3316:3306"

    volumes:
      - crm_mysql_data:/var/lib/mysql

    networks:
      - props-network-crm

volumes:
  crm_mysql_data:
  node_modules:

networks:
  props-network-crm:
    driver: bridge
